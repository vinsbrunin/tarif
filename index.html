<style>
:root{
  --paper:#FFFCF8;
  --paper-2:#FFFFFF;
  --ink:#2B241F;
  --wine:#6E1B24;
  --wine-dark:#4E1119;
  --gold:#B79256;
  --gold-soft:#EADFC8;
  --muted:#7A6E5F;
  --line:rgba(183,146,86,.35);
  --shadow:0 8px 24px rgba(43,36,31,.08);
  --on-wine:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1613;
    --paper-2:#231C18;
    --ink:#EDE4D8;
    --wine:#E4A0A8;
    --wine-dark:#F2C9CE;
    --gold:#D8B77F;
    --gold-soft:#3A2E20;
    --muted:#B5A691;
    --line:rgba(216,183,127,.28);
    --shadow:0 8px 24px rgba(0,0,0,.35);
    --on-wine:#241A16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1613;
  --paper-2:#231C18;
  --ink:#EDE4D8;
  --wine:#E4A0A8;
  --wine-dark:#F2C9CE;
  --gold:#D8B77F;
  --gold-soft:#3A2E20;
  --muted:#B5A691;
  --line:rgba(216,183,127,.28);
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --on-wine:#241A16;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'EB Garamond',serif;
  padding-bottom:24px;
}
a{color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;}

/* ---- Hero ---- */
.hero{
  text-align:center;padding:34px 18px 22px;
  background:linear-gradient(180deg, var(--paper-2), var(--paper));
  border-bottom:1px solid var(--line);
}
.hero-orn{color:var(--gold);font-size:15px;letter-spacing:.4em;margin-bottom:10px;}
.hero-kicker{
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
}
.hero-title{
  font-family:'Playfair Display',serif;font-weight:700;font-size:34px;
  color:var(--wine-dark);margin:6px 0 2px;letter-spacing:.01em;
}
.hero-place{
  font-family:'Montserrat',sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
.hero-rule{width:44px;height:1px;background:var(--gold);margin:14px auto;opacity:.9;}
.hero-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--muted);
}
/* ---- Controlbar ---- */
.controlbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 0;
}
.nav-scroll{
  display:flex;gap:8px;overflow-x:auto;padding:10px 18px 2px;
  scrollbar-width:none;
}
.nav-scroll::-webkit-scrollbar{display:none;}
.chip{
  flex:none;font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.05em;color:var(--muted);
  background:var(--paper-2);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.chip.active,.chip:hover{background:var(--wine);color:var(--on-wine);border-color:var(--wine);}
.theme-toggle{
  flex:none;width:32px;height:32px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper-2);color:var(--muted);
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ---- Sections ---- */
main{padding-top:6px;}
section.card-section{padding:26px 18px 4px;opacity:0;transform:translateY(10px);transition:opacity .5s ease, transform .5s ease;}
section.card-section.in{opacity:1;transform:none;}
.sec-head{text-align:center;margin-bottom:16px;}
.sec-kicker{
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--gold);
}
.sec-title{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;
  color:var(--wine-dark);margin:3px 0 0;
}
.sec-rule{width:30px;height:1px;background:var(--gold);margin:10px auto 0;opacity:.85;}

.group{margin-bottom:20px;}
.group-tag{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--wine);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 8px;
}
.group-unit{font-weight:500;color:var(--muted);font-size:10.5px;letter-spacing:.06em;}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:none;}
.row-txt{display:flex;flex-direction:column;min-width:0;}
.row-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;color:var(--ink);}
.row-note{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:var(--muted);}
.row-price{font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;color:var(--wine);white-space:nowrap;}
.row-prices{display:flex;gap:10px;}
.row-prices span{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;color:var(--wine);}

.region-block{margin-bottom:22px;}
.region-name{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:15px;
  color:var(--gold);margin:0 0 8px;
}
.wine-row{padding:10px 0;border-bottom:1px dashed var(--line);}
.wine-row:last-child{border-bottom:none;}
.wine-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.wine-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;color:var(--ink);}
.wine-mill{color:var(--muted);font-weight:500;font-size:14px;}
.wine-price{font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:var(--wine);white-space:nowrap;}
.wine-meta{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.03em;color:var(--muted);margin-top:2px;}
.wine-desc{font-family:'EB Garamond',serif;font-style:italic;font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.35;}

footer{text-align:center;padding:34px 18px 10px;}
.footer-rule{width:30px;height:1px;background:var(--gold);margin:0 auto 12px;opacity:.85;}
.footer-brand{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--wine-dark);}
.footer-sub{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;}

.totop{
  position:fixed;right:16px;bottom:16px;width:42px;height:42px;border-radius:999px;
  background:var(--wine);color:var(--on-wine);border:none;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;
}
.totop.show{opacity:1;pointer-events:auto;}
</style>

// ============================================================
// RENDU
// ============================================================
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s){
  return String(s==null?"":s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
function drinkRow(item){
  const searchTxt = norm([item.name, item.note].filter(Boolean).join(' '));
  const priceHtml = item.priceLabel ? esc(item.priceLabel) : `${esc(item.price)}&nbsp;€`;
  return `<div class="row" data-search="${esc(searchTxt)}">
    <div class="row-txt">
      <span class="row-name">${esc(item.name)}</span>
      ${item.note ? `<span class="row-note">${esc(item.note)}</span>` : ''}
    </div>
    <span class="row-price">${priceHtml}</span>
  </div>`;
}
function drinkGroup(data){
  return `<div class="group">
    <div class="group-tag"><span>${esc(data.title)}</span>${data.unit ? `<span class="group-unit">${esc(data.unit)}</span>` : ''}</div>
    ${data.items.map(drinkRow).join('')}
  </div>`;
}
function beerGroup(data){
  const subs = data.subs.map(sub => {
    if(sub.sizes){
      const rows = sub.items.map(it => {
        const searchTxt = norm([it.name, it.note].filter(Boolean).join(' '));
        return `<div class="row" data-search="${esc(searchTxt)}">
          <div class="row-txt">
            <span class="row-name">${esc(it.name)}</span>
            ${it.note ? `<span class="row-note">${esc(it.note)}</span>` : ''}
          </div>
          <div class="row-prices">${it.prices.map(p=>`<span>${esc(p)}€</span>`).join('')}</div>
        </div>`;
      }).join('');
      return `<div class="group">
        <div class="group-tag"><span>${esc(data.title)} — ${esc(sub.label)}</span><span class="group-unit">${sub.sizes.join(' / ')}</span></div>
        ${rows}
      </div>`;
    }
    return `<div class="group">
      <div class="group-tag"><span>${esc(data.title)} — ${esc(sub.label)}</span>${sub.unit?`<span class="group-unit">${esc(sub.unit)}</span>`:''}</div>
      ${sub.items.map(drinkRow).join('')}
    </div>`;
  }).join('');
  return subs;
}
function wineRow(w){
  const searchTxt = norm([w.name, w.domaine, w.appellation, w.cepage, w.desc].filter(Boolean).join(' '));
  return `<div class="wine-row" data-search="${esc(searchTxt)}">
    <div class="wine-top">
      <span class="wine-name">${w.millesime ? `<span class="wine-mill">${esc(w.millesime)}</span> ` : ''}${esc(w.name)}</span>
      <span class="wine-price">${esc(w.price)}&nbsp;€</span>
    </div>
    <div class="wine-meta">${[w.domaine, w.appellation, w.cepage].filter(Boolean).map(esc).join(' · ')}</div>
    ${w.desc ? `<div class="wine-desc">${esc(w.desc)}</div>` : ''}
  </div>`;
}
function wineFlatGroup(title, wines){
  return `<div class="group"><div class="group-tag"><span>${esc(title)}</span></div>${wines.map(wineRow).join('')}</div>`;
}
function wineRegionGroups(groups){
  return groups.map(g => `<div class="region-block">
    <div class="region-name">${esc(g.region)}${g.foreign?' · sélection internationale':''}</div>
    ${g.wines.map(wineRow).join('')}
  </div>`).join('');
}
function section(id, kicker, title, inner){
  return `<section class="card-section" id="${id}">
    <div class="sec-head">
      <div class="sec-kicker">${esc(kicker)}</div>
      <h2 class="sec-title">${esc(title)}</h2>
      <div class="sec-rule"></div>
    </div>
    ${inner}
  </section>`;
}

// ---- Reveal on scroll ----
const revealObs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); } });
},{ threshold:0.06 });
document.querySelectorAll('.card-section').forEach(s=>revealObs.observe(s));

// ---- Scrollspy ----
const navLinks = Array.from(document.querySelectorAll('.chip[data-nav]'));
const spyObs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(a=>a.classList.remove('active'));
      const link = navLinks.find(a=>a.dataset.nav === e.target.id);
      if(link){ link.classList.add('active'); link.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'}); }
    }
  });
},{ rootMargin:'-45% 0px -50% 0px', threshold:0 });
document.querySelectorAll('.card-section').forEach(s=>spyObs.observe(s));

// ---- Back to top ----
const totop = document.getElementById('totop');
window.addEventListener('scroll', ()=>{ totop.classList.toggle('show', window.scrollY > 600); }, {passive:true});
totop.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));

// ---- Theme toggle ----
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t){
  if(t){ document.documentElement.setAttribute('data-theme', t); themeToggle.textContent = t==='dark' ? '☀' : '☾'; }
}
let currentTheme = null;
themeToggle.addEventListener('click', ()=>{
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
});
</script>
